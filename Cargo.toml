[workspace]
resolver = "3"
members = [
  "magic-args",
  "magic-args-derive"
]

[workspace.package]
version = "0.1.3"
edition = "2024"
documentation = "https://docs.rs/magic-args"
homepage = "https://git.31c0.org/threadexio/magic-args-rs"
repository = "https://git.31c0.org/threadexio/magic-args-rs"
license = "MIT"
keywords = [ "magic", "function", "argument" ]
categories = [ "rust-patterns", "no-std" ]

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
arithmetic_overflow = "warn"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "allow"
unused_extern_crates = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "allow"
panic = "warn"
self_named_module_files = "warn"
wrong_self_convention = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
str_to_string = "warn"
must_use_candidate = "warn"
redundant_closure_for_method_calls = "warn"
cast_lossless = "warn"
cast_possible_wrap = "warn"
useless_conversion = "warn"
missing_assert_message = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
elidable_lifetime_names = "warn"
iter_without_into_iter = "warn"
new_without_default = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.lints.rustdoc]
all = "warn"
broken_intra_doc_links = "warn"
